<svg width="1200" height="200" viewBox="0 0 1200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="desertGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4a460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#daa520;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffa500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffe0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="1200" height="100" fill="url(#skyGradient)"/>
  
  <!-- Desert ground -->
  <rect x="0" y="100" width="1200" height="100" fill="url(#desertGradient)"/>
  
  <!-- Camel caravan silhouette -->
  <g transform="translate(50, 80)">
    <!-- Person leading -->
    <circle cx="20" cy="20" r="8" fill="#2c3e50"/>
    <rect x="16" y="28" width="8" height="20" fill="#2c3e50"/>
    <rect x="12" y="35" width="4" height="15" fill="#2c3e50"/>
    <rect x="24" y="35" width="4" height="15" fill="#2c3e50"/>
    
    <!-- First camel -->
    <ellipse cx="60" cy="40" rx="25" ry="15" fill="#8b4513"/>
    <ellipse cx="45" cy="35" rx="8" ry="12" fill="#8b4513"/>
    <ellipse cx="75" cy="35" rx="8" ry="12" fill="#8b4513"/>
    <rect x="50" y="25" width="20" height="8" fill="#8b4513"/>
    
    <!-- Second camel -->
    <ellipse cx="120" cy="45" rx="25" ry="15" fill="#8b4513"/>
    <ellipse cx="105" cy="40" rx="8" ry="12" fill="#8b4513"/>
    <ellipse cx="135" cy="40" rx="8" ry="12" fill="#8b4513"/>
    <rect x="110" y="30" width="20" height="8" fill="#8b4513"/>
    
    <!-- Third camel -->
    <ellipse cx="180" cy="50" rx="25" ry="15" fill="#8b4513"/>
    <ellipse cx="165" cy="45" rx="8" ry="12" fill="#8b4513"/>
    <ellipse cx="195" cy="45" rx="8" ry="12" fill="#8b4513"/>
    <rect x="170" y="35" width="20" height="8" fill="#8b4513"/>
    
    <!-- Fourth camel -->
    <ellipse cx="240" cy="55" rx="25" ry="15" fill="#8b4513"/>
    <ellipse cx="225" cy="50" rx="8" ry="12" fill="#8b4513"/>
    <ellipse cx="255" cy="50" rx="8" ry="12" fill="#8b4513"/>
    <rect x="230" y="40" width="20" height="8" fill="#8b4513"/>
    
    <!-- Fifth camel -->
    <ellipse cx="300" cy="60" rx="25" ry="15" fill="#8b4513"/>
    <ellipse cx="285" cy="55" rx="8" ry="12" fill="#8b4513"/>
    <ellipse cx="315" cy="55" rx="8" ry="12" fill="#8b4513"/>
    <rect x="290" y="45" width="20" height="8" fill="#8b4513"/>
  </g>
  
  <!-- Sun -->
  <circle cx="1000" cy="30" r="25" fill="#ffd700" opacity="0.8"/>
</svg>
