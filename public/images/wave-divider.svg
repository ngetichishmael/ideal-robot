<svg width="1200" height="100" viewBox="0 0 1200 100" fill="none" xmlns="http://www.w3.org/16/2000/svg">
  <defs>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9b59b6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Wave path -->
  <path d="M0,50 Q150,20 300,50 T600,50 T900,50 T1200,50 L1200,100 L0,100 Z" fill="url(#waveGradient)" opacity="0.8"/>
  
  <!-- Ankh symbol in center -->
  <g transform="translate(580, 30)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#f39c12" stroke-width="3"/>
    <line x1="20" y1="2" x2="20" y2="38" stroke="#f39c12" stroke-width="3"/>
    <line x1="8" y1="20" x2="32" y2="20" stroke="#f39c12" stroke-width="3"/>
  </g>
</svg>
